<script>
    new Promise((resolve,reject)=>{
       const num =prompt("숫자를 입력하세요");
       if(num >0){
        resolve(num);
       }else{
        reject(num);
       }
    }).then((data)=>{
        
        console.log("할일끝~~");
        console.log(data);
        throw new Error("메세지 ㅋㅋ");
        return data;
        
    }).then((data)=>{
        console.log("두번째 할일끝");
        console.log(data);
        return data;
    }).then((data)=>{
        console.log("세번째 할일끝");
        console.log(data);
    })
    .catch((data)=>{
        console.log("할일실패 ㅜㅜ");
        console.log("data === ",data);
        
        
    });
 
 
</script>
