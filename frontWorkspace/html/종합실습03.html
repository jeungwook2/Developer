<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>회원가입</h1>

    <form>
        <fieldset>
            <legend>필수 입력 사항</legend>
            <table>
                <tr>
                    <th>ID</th>
                    <td><input type="text" placeholder="아이디 10글자 이내" size="30"></td>
                    <td><input type="submit" value="중복확인"></td>
                </tr>
                <tr>
                    <th>비밀번호</th>
                    <td><input type="password" placeholder="영문,숫자,특수문자 포함 8자 이상" size="30"></td>
                </tr>
                <tr>
                    <th>비밀번호 확인</th>
                    <td><input type="password" size="30"></td>
                </tr>
                <tr>
                    <th>Email</th>
                    <td><input type="password" size="30"></td>
                    <td><select>
                            <option value="직접입력">직접입력</option>
                            <option value="naver">naver.com</option>
                            <option value="google">google.com</option>
                        </select>
                    </td>
                </tr>
            </table>
        </fieldset>
        <fieldset>
            <legend>추가 정보</legend>
                프로필 사진 : <input type="file" value="파일 선택">
                <br><br>
                성별 : <input type="radio" name="gender" value="male"> 남자
                <input type="radio" name="gender" value="female"> 여자
                <br><br>
                생년월일 : <input type="date">
                <br><br>
                취미 :<br>
                <input type="checkbox" name="hobby" value="game">게임
                <input type="checkbox" name="hobby" value="exercise">운동
                <input type="checkbox" name="hobby" value="sleep">취침
                <br>
                <input type="checkbox" name="hobby" value="dance">댄스
                <input type="checkbox" name="hobby" value="sing">노래
                <input type="checkbox" name="hobby" value="study">공부
                <br>
                <input type="checkbox" name="hobby" value="etc">기타 :
                <input type="text">

                <br><br>

                자기소개<br>
                <textarea></textarea>
        </fieldset>

    <br>
    <input type="submit" value="회원가입">
    <input type="submit" value="다시입력">
    <input type="submit" value="이전으로">
    </form>
</body>
</html>
