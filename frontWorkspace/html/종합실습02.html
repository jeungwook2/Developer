<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>주문관리</h1>

    <form>
        <fieldset>
            <legend>주문자 정보</legend>
            
            <ol type="1">
                <li>주문자명 : <input type = "text" name="userName" placeholder="name"></li>
                <br>
                <li>email : <input type = "email" name="userEmail" placeholder="1dragon@yaho.com"></li>
                <br>
                <li>홈페이지 : <input type = "url" name="userHttps" placeholder="http://"></li>
            </ol>
        
      
        </fieldset>



    <br>


        <fieldset>
            <legend>주문 정보</legend>
            
            <ul>
                <li>상품명 : <input type = "text" name="userName"></li>
                <br>
                <li>주문수량 : <input type = "number" name="userEmail" placeholder="최소 100"></li>
                <br>
                <li>할인율 : <input type="range" min="0" max="100" value="100" step="10"></li>
                <br>
                <li>요청사항 : <textarea></textarea></li> 
            </ul>
        
      
        </fieldset>

        <br>

        <input type="submit" value="주문하기">

    </form>


</body>
</html>
