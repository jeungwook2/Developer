<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>글자 관련 태그</h1>

    <!-- 제목 지정 태그 -->
    <h1>제목을 지정하는 태그</h1>
    <h2>제목을 지정하는 태그</h2>
    <h3>제목을 지정하는 태그</h3>
    <h4>제목을 지정하는 태그</h4>
    <h5>제목을 지정하는 태그</h5>
    <h6>제목을 지정하는 태그</h6>

    <!-- 줄을 바꾸면서 수평선을 넣는 태그 -->
    <hr>

    <!-- 줄 바꿈 태그 -->
    안녕하세요. <br>
    저는 심원용입니다.

    <!-- 단락 구분 태그 -->
    <p>첫번째 단락</p>
    <p>두번째 단락</p>
    <p>세번째 단락</p>

    <!-- 띄어쓰기 -->
    <p>
        안 녕&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;하세
        요
    </p>

    <!-- 단락 구분 태그 -->
    <pre>
        pre태그도
        단     락
        구분하는
        태그임
    </pre>

    <hr>

    <strong>굵은 글자</strong>
    <br>
    <b>굵은 글자</b>

    <hr>

    <em>기울어진 글자</em>
    <br>
    <i>기울어진 글자</i>

    <hr>
    
    <mark>형광펜</mark>

    <hr>

    <u>밑줄</u>

    <hr>

    <s>취소선</s>

    <hr>

    기본 글자
    <small>작은 글자</small>

    <hr>

    기본글자
    <big>큰 글자<big/>

    <hr>

    <strong><em><mark>형광펜이 칠해져있고, 기울어진, 굵은 글자</mark></em></strong>

</body>
</html>
