<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정규 표현식 회원가입 폼</title>
    <style>
        .hint {
            color: gray;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>정규 표현식 회원가입 폼</h1>

    <hr>

    <form>
        <label>
            * 아이디 : 
            <input type="text" name="userId" id="userId" required><br>
            <label class="hint">영문자, 숫자 포함하여 총 4~12자로 입력하시오. 단, 첫 글자는 반드시 영문자로</label>
        </label>
        <br><br>

        <label>
            * 비밀번호 : 
            <input type="password" name="userPwd1" id="userPwd1" required><br>
            <label class="hint">영문자, 숫자, 특수문자 포함하여 총 8~15자로 입력하시오.</label>
        </label>
        <br><br>

        <label>
            * 비밀번호 확인 : 
            <input type="password" name="userPwd2" id="userPwd2" required><br>
            <label class="hint">위의 비밀번호와 일치하게 입력하시오.</label>
        </label>
        <br><br>

        <label>
            * 이름 : 
            <input type="text" name="userName" id="userName" required><br>
            <label class="hint">한글로만 이루어져야 되며 2글자 이상으로 입력하시오.</label>
        </label>
        <br><br>

        <label>
            * 이메일 : 
            <input type="email" name="email" id="email" required><br>
            <label class="hint">이메일 형식에 맞춰서 입력하시오.</label>
        </label>
        <br><br>


        <br><br>

        <input type="submit" value="회원가입" onclick="return validate();">
        <input type="reset">
    </form>    

    <script>
        function validate() {
            // 아이디
            const regexp1 = /^[a-z][a-z0-9]{3,11}$/i;
            const idValue = document.querySelector("#userId").value;
            if (!regexp1.test(idValue)) {
                alert("아이디 문제있음...");
                return false;
            }

            // 비밀번호
            const regexp2_1 = /^.{8,15}$/i;
            const regexp2_2 = /[a-z]{1,}/i;
            const regexp2_3 = /[0-9]{1,}/i;
            const regexp2_4 = /[~!@#$%^&*()]{1,}/i;
            const pwdValue = document.querySelector("#userPwd1").value;
            if (
                !(regexp2_1.test(pwdValue) &&
                  regexp2_2.test(pwdValue) &&
                  regexp2_3.test(pwdValue) &&
                  regexp2_4.test(pwdValue))
            ) {
                alert("비밀번호 문제있음...")
                return false;
            }

            // 비밀번호 확인
            const pwdValue2 = document.querySelector("#userPwd2").value;
            if (pwdValue !== pwdValue2) {
                alert("비밀번호 확인 문제있음...")
                return false;
            }
  
            // 이름
            const regexp4 = /^[가-힣]{2,}$/;
            const nameValue = document.querySelector("#userName").value;
            if (!regexp4.test(nameValue)) {
                alert("이름 문제있음...")
                return false;
            }

            // 이메일
            const regexp5 = /^[a-z0-9]{1,}@[a-z0-9]{1,}\.com$/;
            const emailValue = document.querySelector("#email").value;
            if (!regexp5.test(emailValue)) {
                alert("이메일 문제있음...")
                return false;
            }
            
            alert("회원가입 성공!");
            return true;
        }
    </script>
</body>
</html>
