<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border:3px solid blue;
        }
        .result {
            height:50px;
            font-size:2em;
            font-weight:bold;
            text-align:right;
            border:1px solid black;
            width:210px;
            overflow:hidden;
        }
        button {
            font-size:1.5em;
            font-weight:bold;
            width:50px;
            height:50px;
        }
    </style>
</head>
<body>
    
    <table>
        <tr>
            <td colspan="4">
                <div class="result">0</div>
            </td>
        </tr>
        <tr>
            <td>
                <button onclick="clickEvent(this.innerHTML)">(</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">)</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">%</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">AC</button>
            </td>
        </tr>
        <tr>
            <td>
                <button onclick="clickEvent(this.innerHTML)">7</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">8</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">9</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">/</button>
            </td>
        </tr>
        <tr>
            <td>
                <button onclick="clickEvent(this.innerHTML)">4</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">5</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">6</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">*</button>
            </td>
        </tr>
        <tr>
            <td>
                <button onclick="clickEvent(this.innerHTML)">1</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">2</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">3</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">-</button>
            </td>
        </tr>
        <tr>
            <td>
                <button onclick="clickEvent(this.innerHTML)">0</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">.</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">=</button>
            </td>
            <td>
                <button onclick="clickEvent(this.innerHTML)">+</button>
            </td>
        </tr>
    </table>

    <script>
        
        function clickEvent(button){
                let result = document.querySelector(".result");
                    
                if(button == 'AC'){
                    result.innerHTML = 0;
                }else if(button == '='){
                    result.innerHTML = eval(result.innerHTML);
                }else{
                    let str = button;
                    
                    if(result.innerHTML == '0'){
                        result.innerHTML = str;
                    }else{
                        result.innerHTML += str;
                    }
                }
            }
    </script>
</body>
</html>
